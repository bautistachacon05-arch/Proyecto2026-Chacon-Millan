<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Equipo SportZone" />
    <meta name="description" content="Carrito de SportZone." />
    <title>SportZone | Carrito</title>
    <link rel="icon" href="imagenes/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header">
        <h1 class="logo"><a href="index.html">SportZone</a></h1>
        <nav aria-label="Navegación">
          <a href="index.html">Inicio</a><a href="productos.html">Productos</a
          ><a href="canchas.html">Canchas</a><a href="info.html">Info</a
          ><a href="contacto.html">Contacto</a
          ><a href="carrito.html"
            >🛒 Carrito (<span class="nav-contador">0</span>)</a
          >
        </nav>
      </div>
    </header>
    <main>
      <h2>Carrito</h2>
      <p>
        Acá podés ver los productos que agregaste y las canchas que reservaste.
      </p>
      <section class="bloque carrito-pagina">
        <div id="carrito"><p>El carrito está vacío.</p></div>
      </section>
      <!-- Este es el formulario que inicia oculto (display: none) -->
      <div
        id="formulario-checkout"
        style="display: none; max-width: 500px; margin: auto; padding: 20px"
      >
        <h2>Completar compra</h2>

        <label for="checkout-nombre">Nombre y apellido *</label>
        <input
          type="text"
          id="checkout-nombre"
          placeholder="Tu nombre"
          required
        />
        <br /><br />

        <label for="checkout-telefono">Teléfono *</label>
        <input
          type="tel"
          id="checkout-telefono"
          placeholder="Tu teléfono"
          required minlength="8" maxlength="15" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    
        <br /><br />

        <label>Forma de entrega *</label><br />

        <!-- Opción 1 -->
        <input
          type="radio"
          name="checkout-entrega"
          value="Lo retiro personalmente"
          id="entrega-retiro"
          required
        />
        <label for="entrega-retiro">Lo retiro personalmente</label>
        <br />

        <!-- Opción 2 -->
        <input
          type="radio"
          name="checkout-entrega"
          value="Envío a domicilio"
          id="entrega-envio"
        />
        <label for="entrega-envio">Envío a domicilio</label>
        <br /><br />

        <label>Forma de pago *</label><br />
        <input
          type="radio"
          name="checkout-pago"
          value="Efectivo"
          id="pago-efectivo"
        />
        <label for="pago-efectivo">Efectivo</label><br />

        <input
          type="radio"
          name="checkout-pago"
          value="Tarjeta"
          id="pago-tarjeta"
        />
        <label for="pago-tarjeta">Tarjeta débito/crédito</label><br />

        <input
          type="radio"
          name="checkout-pago"
          value="Transferencia"
          id="pago-transferencia"
        />
        <label for="pago-transferencia">Transferencias</label>
        <br /><br />

        <!-- Botón temporal solo para probar que llegamos hasta aquí -->
        <button type="button" onclick="probarFormulario()">Hacer pedido</button>
      </div>
      <!--PRUEBA-->
    </main>
    <footer><p>SportZone - Proyecto académico</p></footer>
    <script src="script.js"></script>
  </body>
</html>
